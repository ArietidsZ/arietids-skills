interface:
  display_name: "Handwritten PDF Transcription"
  short_description: "Transcribe handwritten PDFs into reviewed Markdown"
  default_prompt: "Use $handwritten-pdf-transcription to transcribe this handwritten PDF with high fidelity, run transcription review automatically, promote the final result to the PDF basename with .md only if that destination does not already exist, preserve the workspace on any final-output collision, clean up temporary artifacts after success, and return the final Markdown path."
