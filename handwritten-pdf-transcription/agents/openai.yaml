interface:
  display_name: "Handwritten PDF Transcription"
  short_description: "Transcribe handwritten PDFs into Markdown"
  default_prompt: "Transcribe this handwritten PDF into structured Markdown with high fidelity in the source language. Do not summarize, paraphrase, or omit content. Use the `pdf` skill for PDF handling and visual inspection. Create a working folder next to the source PDF with pages/, parts/, zoomed/, and transcription.md. Render every page at 300 DPI or higher with an image-object-capable renderer so cropped zoom rechecks and saved zoomed/page_NNN_region_MM.png artifacts are possible. Write one file per source page under parts/page_NNN.md. Add a `LOW_CONFIDENCE` block to each page file for every region below 99% confidence so those audit notes drive the zoom review pass. For batching, use 1 page for a single-page document, 1 page per batch for 2-5 pages, 2-3 pages per batch for 6-20 pages, and 4-5 pages per batch above 20 pages. When dispatching page workers, use this skill's bundled worker prompt file at `references/transcription-worker-prompt.md`. Dispatch all batches in the same turn when subagents are available; otherwise write the same per-page files sequentially yourself while preserving handwritten emphasis with Markdown emphasis when appropriate and comparing each page's Markdown back against the image line by line before finalizing it. Save low-confidence zoom crops under zoomed/page_NNN_region_MM.png. Represent diagrams only with ASCII, precise textual descriptions, or coordinate-style descriptions that preserve the original relationships. Recheck every low-confidence region with those saved zoomed crops, resolve or convert review notes into the allowed final inline form before merge, use `[?]` only for marks that remain unresolved after zoom rechecks, never use placeholders like `[illegible]` or `[unreadable]`, merge the per-page files into transcription.md with explicit page markers, ensure transcription.md contains no LOW_CONFIDENCE comments, and report that final path."
