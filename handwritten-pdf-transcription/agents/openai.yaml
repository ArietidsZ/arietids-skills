interface:
  display_name: "Handwritten PDF Transcription"
  short_description: "Transcribe handwritten PDFs into Markdown"
  default_prompt: "Transcribe this handwritten PDF into structured Markdown with high fidelity in the source language. Do not summarize, paraphrase, or omit content. Create a working folder next to the source PDF, follow the batching rules from the skill and `references/transcription-worker-prompt.md`, dispatch all page batches in same-turn parallel workers, write one file per page under parts/, recheck every low-confidence region with zoomed images, resolve or convert low-confidence review notes into the allowed final form before merge, ensure transcription.md contains no LOW_CONFIDENCE comments, and report that final path."
